<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/shared/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/portal-theme.css">
    <title>Level 4 Module 1 | Future Tech School Program</title>
<script>window.FT_REQUIRED_LEVEL = "level4";</script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/level-guard.js"></script>
</head>
<body class="ft-portal-theme">
    <header class="ft-header">
    <nav class="navbar navbar-expand-xl ft-navbar">
      <div class="container-fluid">
        <a href="login-level1.html" class="d-flex align-items-center text-decoration-none ft-logo-wrap">
          <img src="assets/images/shared/logo.png" width="60" height="60" alt="Future Tech logo" class="rounded-3">
          <span class="ms-2 text-white fw-bold d-none d-lg-inline" style="font-size:1.05rem;line-height:1.1;">FUTURE TECH<br><span class="text-warning" style="font-size:.8rem;">SCHOOL PROGRAM</span></span>
        </a>
      </div>
    </nav>
  </header>

  <section class="mt-4">
    <div class="container" style="max-width:820px;">
        <p class="pt-eyebrow text-center mb-1">Level 4</p>
        <h1 class="pt-page-title pt-serif text-center">Module 1 &mdash; Advanced Python</h1>
        <p class="pt-page-sub text-center mx-auto">Open each class's notes PDF, then take the module quiz once you've been through all 25 classes.</p>

        <div class="pt-progress-label text-center" id="progressLabel"></div>
        <div class="pt-progress-track mx-auto"><div class="pt-progress-fill" id="progressFill"></div></div>

        <div class="pt-ledger mt-4" id="classLedger"></div>

        <div class="text-center mt-5 mb-5">
            <a href="level4-module1-quiz.html" class="btn btn-primary py-3 px-5 fs-5 text-decoration-none">
                Take the Module Quiz <span class="bi bi-arrow-right ms-2"></span>
            </a>
        </div>
     </div>
  </section>

    <script>
      // ---- Class list (content only — id/title stay exactly as before) ----
      var CLASSES = [
        { file: "cl1.pdf",  title: "Advanced Python Introduction" },
        { file: "cl2.pdf",  title: "Python Programming Best Practices" },
        { file: "cl3.pdf",  title: "Advanced Variables &amp; Data Types" },
        { file: "cl4.pdf",  title: "Strings &amp; Advanced String Operations" },
        { file: "cl5.pdf",  title: "Lists &amp; Advanced List Operations" },
        { file: "cl6.pdf",  title: "Tuples &amp; Sets" },
        { file: "cl7.pdf",  title: "Dictionaries" },
        { file: "cl8.pdf",  title: "List, Set &amp; Dictionary Comprehension" },
        { file: "cl9.pdf",  title: "Functions – Advanced Concepts" },
        { file: "cl10.pdf",  title: "*args and **kwargs" },
        { file: "cl11.pdf",  title: "Lambda Functions" },
        { file: "cl12.pdf",  title: "map(), filter() &amp; reduce()" },
        { file: "cl13.pdf",  title: "Modules &amp; Packages" },
        { file: "cl14.pdf",  title: "File Handling" },
        { file: "cl15.pdf",  title: "CSV File Handling" },
        { file: "cl16.pdf",  title: "JSON Data Handling" },
        { file: "cl17.pdf",  title: "Exception Handling" },
        { file: "cl18.pdf",  title: "Debugging Python Programs" },
        { file: "cl19.pdf",  title: "Object-Oriented Programming" },
        { file: "cl20.pdf",  title: "Constructors &amp; Methods" },
        { file: "cl21.pdf",  title: "Inheritance &amp; Polymorphism" },
        { file: "cl22.pdf",  title: "Encapsulation &amp; Abstraction" },
        { file: "cl23.pdf",  title: "Python Libraries" },
        { file: "cl24.pdf",  title: "Python Mini Project" },
        { file: "cl25.pdf",  title: "Module Assessment" }
      ];

      // Cosmetic only: remembers which PDFs this browser has opened, purely
      // to fill in the progress bar and checkmarks on this page. It is NOT
      // how access is controlled (the backend re-checks the student's level
      // on every PDF request — see content.js) and it does not sync across
      // devices. Real quiz completion (further down the flow) IS persisted
      // server-side via /api/quiz-results.
      var OPENED_KEY = "ft_level4_module1_opened";
      function getOpened() {
        try { return JSON.parse(localStorage.getItem(OPENED_KEY) || "[]"); }
        catch (e) { return []; }
      }
      function markOpened(file) {
        var opened = getOpened();
        if (opened.indexOf(file) === -1) {
          opened.push(file);
          localStorage.setItem(OPENED_KEY, JSON.stringify(opened));
        }
        renderLedger();
      }

      function openPdf(moduleFolder, filename) {
        var base = (window.FT_CONFIG && window.FT_CONFIG.API_BASE_URL) || "http://localhost:5000/api";
        var lvl = window.FT_REQUIRED_LEVEL;
        var url = base + "/content/pdf/" + lvl + "/" + moduleFolder + "/" + filename +
                  "?token=" + encodeURIComponent(window.FT_STUDENT_TOKEN || "");
        window.open(url, "_blank");
        markOpened(filename);
      }

      function renderLedger() {
        var opened = getOpened();
        var ledger = document.getElementById("classLedger");
        ledger.innerHTML = CLASSES.map(function (c, i) {
          var num = i + 1;
          var isOpened = opened.indexOf(c.file) !== -1;
          return (
            '<div class="pt-ledger-row">' +
              '<div class="pt-ledger-num">' + String(num).padStart(2, "0") + '</div>' +
              '<div class="pt-ledger-status ' + (isOpened ? "done" : "") + '">' + (isOpened ? "&#10003;" : "") + '</div>' +
              '<div class="pt-ledger-main">' +
                '<div class="pt-ledger-title">Class ' + num + ': ' + c.title + '</div>' +
                '<div class="pt-ledger-meta">' + (isOpened ? "Opened" : "PDF notes") + '</div>' +
              '</div>' +
              '<a href="javascript:void(0)" onclick="openPdf(\'module1\',\'' + c.file + '\')" class="pt-ledger-action ' + (isOpened ? "secondary" : "") + '">' +
              (isOpened ? "Reopen PDF" : "Open PDF") + '</a>' +
            '</div>'
          );
        }).join("");

        document.getElementById("progressLabel").textContent =
          opened.length + " / " + CLASSES.length + " classes opened";
        document.getElementById("progressFill").style.width =
          Math.round((opened.length / CLASSES.length) * 100) + "%";
      }

      renderLedger();
    </script>
</body>
</html>
