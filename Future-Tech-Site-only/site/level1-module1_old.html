<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/images/shared/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <link rel="stylesheet" href="assets/css/portal-theme.css">
    <title>Level 1 Module 1 | Future Tech School Program</title>
<script>window.FT_REQUIRED_LEVEL = "level1";</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/level-guard.js"></script>
</head>
<body class="ft-portal-theme">
    <header class="ft-header">
    <nav class="navbar navbar-expand-xl ft-navbar">
      <div class="container-fluid">
        <a href="student-portal.html" class="d-flex align-items-center text-decoration-none ft-logo-wrap">
          <img src="assets/images/shared/logo.png" width="60" height="60" alt="Future Tech logo" class="rounded-3">
          <span class="ms-2 text-white fw-bold d-none d-lg-inline" style="font-size:1.05rem;line-height:1.1;">FUTURE TECH<br><span class="text-warning" style="font-size:.8rem;">SCHOOL PROGRAM</span></span>
        </a>
      </div>
    </nav>
  </header>

  <section class="mt-4">
    <div class="container" style="max-width:820px;">
        <p class="pt-eyebrow text-center mb-1"><a href="student-portal.html" class="text-decoration-none" style="color:inherit;">Student Portal</a> &nbsp;/&nbsp; Level 1</p>
        <h1 class="pt-page-title pt-serif text-center">Module 1 &mdash; Computer Basics</h1>
        <p class="pt-page-sub text-center mx-auto">Open each class's notes PDF or recorded video, then take the module quiz and practical once you've been through all the classes.</p>

        <div class="text-center mb-3 d-none" id="liveClassBanner">
          <a href="javascript:void(0)" id="liveClassBtn" target="_blank" rel="noopener"
             class="btn btn-danger text-decoration-none px-4">
            <span class="bi bi-camera-video-fill me-2"></span>Join Live Class
          </a>
          <div class="small text-muted mt-1" id="liveClassNote"></div>
        </div>

        <div class="pt-progress-label text-center" id="progressLabel"></div>
        <div class="pt-progress-track mx-auto"><div class="pt-progress-fill" id="progressFill"></div></div>

        <div class="pt-ledger mt-4" id="classLedger"></div>

        <div class="text-center mt-5 mb-5">
            <a href="level1-module1-quiz.html" class="btn btn-primary py-3 px-5 fs-5 text-decoration-none">
                Take the Module Quiz <span class="bi bi-arrow-right ms-2"></span>
            </a>
        </div>
     </div>
  </section>

  <!-- Recorded-video player - used for a class whose video was uploaded
       directly (not an external link, which just opens in a new tab). -->
  <div class="modal fade" id="videoModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="videoModalTitle">Recorded Video</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0 bg-black">
          <video id="videoPlayer" controls style="width:100%;max-height:70vh;"></video>
        </div>
      </div>
    </div>
  </div>

    <script>
      // Class list (title, PDF, recorded video) - admin-managed now, loaded
      // live from the server instead of a hardcoded list here.
      var CLASSES = []; // populated by loadClasses() before first render

      // Tracks which class PDFs THIS student has opened, saved server-side
      // (see /api/class-progress) against their own student account - so
      // it follows them across devices/browsers, and a different student
      // logging in on the same browser never inherits someone else's
      // "opened" state. Real quiz completion is likewise persisted
      // server-side via /api/quiz-results.
      var openedFiles = []; // populated by loadOpened() before first render

      function apiBase() {
        return "https://future-tech-fullstack-7.onrender.com/";
      }

      async function loadClasses() {
        try {
          var res = await fetch(
            apiBase() + "/content/classes/" + window.FT_REQUIRED_LEVEL + "/module1",
            { headers: { Authorization: "Bearer " + (window.FT_STUDENT_TOKEN || "") } }
          );
          if (!res.ok) throw new Error("Could not load classes");
          CLASSES = await res.json();
        } catch (e) {
          console.error("Could not load class list", e);
          CLASSES = [];
        }
        await loadOpened();
      }

      async function loadLiveClass() {
        try {
          var res = await fetch(
            apiBase() + "/content/live-class/" + window.FT_REQUIRED_LEVEL + "/module1",
            { headers: { Authorization: "Bearer " + (window.FT_STUDENT_TOKEN || "") } }
          );
          if (!res.ok) return;
          var data = await res.json();
          if (data.meetingUrl) {
            document.getElementById("liveClassBtn").href = data.meetingUrl;
            document.getElementById("liveClassNote").textContent = data.note || "";
            document.getElementById("liveClassBanner").classList.remove("d-none");
          }
        } catch (e) {
          console.error("Could not load live class info", e);
        }
      }

      async function loadOpened() {
        try {
          var res = await fetch(
            apiBase() + "/class-progress/me?level=" + encodeURIComponent(window.FT_REQUIRED_LEVEL) + "&module=module1",
            { headers: { Authorization: "Bearer " + (window.FT_STUDENT_TOKEN || "") } }
          );
          if (!res.ok) throw new Error("Could not load progress");
          var data = await res.json();
          openedFiles = data.files || [];
        } catch (e) {
          console.error("Could not load class progress", e);
          openedFiles = [];
        }
        renderLedger();
      }

      // Progress is tracked per CLASS (its stable id), not per filename -
      // so it still works for a video-only class, and survives the admin
      // later replacing a class's PDF/video file.
      function markOpened(classId) {
        if (openedFiles.indexOf(classId) === -1) {
          openedFiles.push(classId);
          renderLedger();
        }
        // Best-effort save - the content has already opened either way, so
        // a save failure here shouldn't interrupt the student; it'll just
        // re-sync next time loadOpened() runs.
        fetch(apiBase() + "/class-progress", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + (window.FT_STUDENT_TOKEN || ""),
          },
          body: JSON.stringify({ level: window.FT_REQUIRED_LEVEL, module: "module1", file: classId }),
        }).catch(function (e) { console.error("Could not save class progress", e); });
      }

      function openPdf(classId, filename) {
        var base = apiBase();
        var lvl = window.FT_REQUIRED_LEVEL;
        var url = base + "/content/pdf/" + lvl + "/module1/" + filename +
                  "?token=" + encodeURIComponent(window.FT_STUDENT_TOKEN || "");
        window.open(url, "_blank");
        markOpened(classId);
      }

      function openVideo(classId, title, videoFile, videoUrl) {
        if (videoUrl) {
          // External link (YouTube/Drive/etc.) - just open it.
          window.open(videoUrl, "_blank");
          markOpened(classId);
          return;
        }
        var base = apiBase();
        var lvl = window.FT_REQUIRED_LEVEL;
        var url = base + "/content/video/" + lvl + "/module1/" + videoFile +
                  "?token=" + encodeURIComponent(window.FT_STUDENT_TOKEN || "");
        document.getElementById("videoModalTitle").textContent = title;
        var player = document.getElementById("videoPlayer");
        player.src = url;
        new bootstrap.Modal(document.getElementById("videoModal")).show();
        markOpened(classId);
      }
      document.getElementById("videoModal").addEventListener("hidden.bs.modal", function () {
        var player = document.getElementById("videoPlayer");
        player.pause();
        player.removeAttribute("src");
        player.load();
      });

      function renderLedger() {
        var opened = openedFiles;
        var ledger = document.getElementById("classLedger");
        ledger.innerHTML = CLASSES.map(function (c) {
          var num = c.classNumber;
          var isOpened = opened.indexOf(c.id) !== -1;
          var hasVideo = !!(c.videoFile || c.videoUrl);
          var titleEsc = String(c.title).replace(/'/g, "&#39;");
          var pdfBtn = c.pdfFile
            ? '<a href="javascript:void(0)" onclick="openPdf(\'' + c.id + '\',\'' + c.pdfFile + '\')" class="pt-ledger-action ' + (isOpened ? "secondary" : "") + '">' +
              (isOpened ? "Reopen PDF" : "Open PDF") + '</a>'
            : '';
          var videoBtn = hasVideo
            ? '<a href="javascript:void(0)" onclick="openVideo(\'' + c.id + '\',\'' + titleEsc + '\',' +
              (c.videoFile ? "'" + c.videoFile + "'" : 'null') + ',' +
              (c.videoUrl ? "'" + c.videoUrl + "'" : 'null') + ')" class="pt-ledger-action secondary ms-2">' +
              '<span class="bi bi-play-circle me-1"></span>Watch Video</a>'
            : '';
          return (
            '<div class="pt-ledger-row">' +
              '<div class="pt-ledger-num">' + String(num).padStart(2, "0") + '</div>' +
              '<div class="pt-ledger-status ' + (isOpened ? "done" : "") + '">' + (isOpened ? "&#10003;" : "") + '</div>' +
              '<div class="pt-ledger-main">' +
                '<div class="pt-ledger-title">Class ' + num + ': ' + c.title + '</div>' +
                '<div class="pt-ledger-meta">' + (isOpened ? "Opened" : (c.pdfFile ? "PDF notes" : "")) + (hasVideo ? (c.pdfFile ? " &middot; Video available" : "Video available") : "") + '</div>' +
              '</div>' +
              pdfBtn + videoBtn +
            '</div>'
          );
        }).join("");

        var total = CLASSES.length || 1;
        document.getElementById("progressLabel").textContent =
          opened.length + " / " + CLASSES.length + " classes opened";
        document.getElementById("progressFill").style.width =
          Math.round((opened.length / total) * 100) + "%";
      }

      loadClasses();
      loadLiveClass();
    </script>
</body>
</html>
